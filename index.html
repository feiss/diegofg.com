    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Diego F. Goberna - Portfolio</title>
    <link rel="stylesheet" type="text/css" href="style.css">

    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@v0.186.1/build/three.module.js",

<body>
    <canvas id="scene3d"></canvas>
    <div id="all">
        <header></header>

        <div id="main">
            <h1>DIEGO F. GOBERNA
                <span>Technical Artist & Creative Developer</span>
            </h1>
            <nav>
                <a href="index.html#/projects" data-section="projects">Selected Works</a>
                <a href="index.html#/about" data-section="about">About me</a>
                <a href="index.html#/lab" data-section="lab">Lab</a>
                <a href="index.html#/archive" data-section="archive">Archive</a>
            </nav>

            <div id="content">
            </div>
        </div>
        <!-- <footer></footer> -->
    </div>
</body>


<script>
    let loading = false;

    function load_page(page) {
        if (page[0] == '#') page = page.substr(1);
        const section = page.split('/')[0];

        if (loading) return;
        loading = true;
        // document.querySelector('nav').classList.add("disabled");
        set_menu_section(section);

        if (section === '') {
            // go home
            document.getElementById('content').innerHTML = '';
        }
        else fetch(page + "/meta.html")
            .then(response => response.text())
            .then(html => {
                const div = document.getElementById('content');
                div.classList.add("transition");
                setTimeout(() => {
                    let close_button = '';
                    const sections = page.split('/');
                    if (sections.length > 1) {
                        close_button = '<a href="index.html#/' + sections[0] + '" class="close_button">&times;</a>';
                    }
                    div.innerHTML = close_button + html + close_button;
                }, 92);
                setTimeout(() => {
                    div.classList.remove("transition");
                    loading = false;
                    // document.querySelector('nav').classList.remove("disabled");
                }, 400);
            })
            .catch(error => {
                loading = false;
                console.error('Failed to fetch ' + page + ': ', error);
                // document.querySelector('nav').classList.remove("disabled");
            });
    }

    function set_menu_section(section) {
        const items = document.querySelectorAll('nav a');
        for (let i = 0; i < items.length; i++) {
            items[i].classList.toggle('active', items[i].dataset.section == section);
        }
    }

    Router.add({
        path: '#/', on: function () {
            load_page('');
        }
    });

    Router.add({
        path: '#/projects', on: function () {
            load_page('projects');
        }
    });


    Router.add({
        path: '#/projects/:proj', on: function () {
            load_page('projects/' + this.params.proj);
        }
    });

    Router.add({
        path: '#/about', on: function () {
            load_page('about');
        }
    });

    Router.add({
        path: '#/lab', on: function () {
            load_page('lab');
        }
    });

    Router.add({
        path: '#/lab/:proj', on: function () {
            load_page('lab/' + this.params.proj);
        }
    });


    Router.add({
        path: '#/archive', on: function () {
            load_page('archive');
        }
    });

    Router.add({
        path: '#/archive/:proj', on: function () {
            load_page('archive/' + this.params.proj);
        }
    });


    Router.init();
</script>
