<!DOCTYPE html>
<html>

<head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-176592956-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'UA-176592956-1');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Diego F. Goberna - Portfolio</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div id="all">
        <header></header>

        <div id="main">
            <h1>DIEGO F. GOBERNA
                <span>Technical Artist & Creative Developer</span>
            </h1>
            <nav>
                <a href="#" data-section="projects" onclick="load_page(event, 'projects')">Selected Works</a>
                <a href="#" data-section="about" onclick="load_page(event, 'about')">About me</a>
                <a href="#" data-section="lab" onclick="load_page(event, 'lab')">Lab</a>
                <a href="#" data-section="archive" onclick="load_page(event, 'archive')">Archive</a>
            </nav>

            <div id="content">
            </div>
        </div>
        <footer></footer>
    </div>
</body>


<script>
    let loading = false;
    let page_history = [''];

    function load_page(ev, page, going_back) {
        if (page !== undefined) ev.preventDefault(); else page = ev;

        if (page[0] == '#') page = page.substr(1);

        const section = page.split('/')[0];

        if (loading) return;
        loading = true;
        // document.querySelector('nav').classList.add("disabled");
        set_menu_section(section);

        if (going_back !== true) {
            page_history.push(window.location.hash);
            handleForwardNavigation();
        }
        if (section === '') {
            // go home
            document.getElementById('content').innerHTML = '';
        }
        else fetch(page + "/meta.html")
            .then(response => response.text())
            .then(html => {
                const div = document.getElementById('content');
                div.classList.add("transition");
                setTimeout(() => {
                    div.innerHTML = html;
                }, 92);
                setTimeout(() => {
                    div.classList.remove("transition");
                    loading = false;
                    window.location.hash = page;
                    // document.querySelector('nav').classList.remove("disabled");
                }, 400);
            })
            .catch(error => {
                loading = false;
                console.error('Failed to fetch ' + page + ': ', error);
                document.querySelector('nav').classList.remove("disabled");
            });
    }

    function set_menu_section(section) {
        const items = document.querySelectorAll('nav a');
        for (let i = 0; i < items.length; i++) {
            items[i].classList.toggle('active', items[i].dataset.section == section);
        }

    }

    function handleForwardNavigation() {
        sessionStorage.setItem('go_forward', 'true');
    }

    function init() {
        window.addEventListener('popstate', (event) => {
            event.preventDefault();
            const isForward = sessionStorage.getItem('go_forward');
            if (isForward !== 'true') {
                const url = page_history.pop();
                if (url !== undefined) {
                    load_page(event, url, true);
                }
            }
            sessionStorage.removeItem('go_forward');
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        init();
        if (location.hash.length > 0) {
            load_page(location.hash);
        }
        // DEV
        else {
            load_page('projects')
        }
    });
</script>

</html>
