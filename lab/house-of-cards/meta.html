<h2>House of Cards</h2>
<dl>
    <dt>Houdini</dt>
</dl>

<p>When Radiohead released their LIDAR-based videoclip for the song "<a href="https://www.youtube.com/watch?v=8nTFjVm9sTQ">House of Cards</a>", they also released some
    point cloud data so everybody could play with them (<a href="https://github.com/dataarts/radiohead">link</a>). I converted the CSV files to OBJ and played with them
    in
    Houdini.</p>
